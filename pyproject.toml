[project]
name = "internship-scout-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi~=0.162.0",
    "uvicorn[standard]~=0.54.0",
    "psycopg[binary]~=3.3.6",
    "httpx~=0.28.1",
    "anthropic~=2.3.0",
]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
